<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
  function formValdiate() {
      /*
      form 태그를 배열형태로 얻어와서 사용하는 방법으로 HTML 문서에는 2개
      이상의 form을 정의할 수 있다. 인덱스는 작성된 순서대로 부여된다.
      */
      //form 태그의 DOM을 얻어온다
      var frm = document.forms[0];
      //form 하위 태그인 input에 접근하여 아이디 입력값이 있는지 확인 
      if(frm.id.value == ""){
          //입력된 갑이 없다면 경고차을 띄우고 포커스를 이동
          alert("아이디를 입력해주세요.");
          frm.id.focus();
          //이벤트 리스너로 false를 반환해서 전송을 차단한다.
          return false;
      }
      //부정연산자를 통해서도 빈값 체크를 할 수 있다. 
      if(!frm.pw.value){
          alert("패스워드를 입력해주세요.");
          frm.pw.focus();
          return false;
      } 
      /*
      false가 반환되지 않으면 묵시적으로 true가 반환된것으로 인식한다.
      따라서 아래 문장은 생략할 수 있다.
      */
      //return true;
  }
  function jsSubmit() {
    /*
    form 태그의 DOM을 얻어온다.
    */
    var f = document.loginFrm2;
    if(f.id.value == ""){
      alert("아이디를 입력해주세요.");
      f.id.focus();
      /*
      Js를 통해 폼값을 전송하는 경우에는 검증의 문제가 있을떄 단순히
      return을 통해 함수의 실행만 종료하면된다.
      */
      return;
    }
    if(f.pw.value == ""){
      alert("패스워드를 입력해주세요.");
      f.pw.focus();
      return;
    }
    /*
    JS를 통해 action, method 속성값을 부여한다. 이 경우 HTML에서 
    물리적으로 부여한 속성보다 우선순위가 없으므로 여기서 지정한
    속성으로 지정된다.*/
    f.action = "";
    f.method = "get";
    //JS에서 submit 함수를 이용해서 폼값을 전송한다.
    f.submit();
  }
  </script>
</head>
<body>
    <h2>form전송방식 - HTML을 사용하는 방법</h2>
    <!-- 
    submit 이벤트가 발생되면 JS함수를 호출한다. 입력값이 없는 상태로
    로그인 버튼을 누르면 false가 반환되어 전송은 차단된다.
    action 속성은 지정하지 않았으므로 현재페이지로 폼값이 전송된다. 
    -->
    <form name="loginFrm1" method="get">
        아이디 : <input type="text" name="id">
        <br>
        패스워드 : <input type="password" name="pw">
        <br>
        <!-- 
        submit 타입의 버튼은 누르는 즉시 '제출' 이벤트가 발생되어
        서버로 값이 전송된다. 전송방식이 get이므로 '전송할URL?id=xxx'
        와 같은 쿼리스트링 형식으로 폼값이 전송된다.
        -->
        <input type="submit" value="로그인">
    </form>

    <h2>form전송방식 - Javascript를 사용하는 방법</h2>
    <!-- 
    Javascript를 이용하면 method, action과 같은 속성들을 모두 제어할 
    수 있다. 
    -->
    <form name="loginFrm2" method="post" action="abcd.html">
        아이디 : <input type="text" name="id">
        <br>
        패스워드 : <input type="password" name="pw">
        <br>
        <!-- 버튼 자체적으로 submit 기능이 없으므로 호출한 함수에서
         강제로 전송해야한다. -->
        <input type="button" value="로그인" onclick="jsSubmit();">
    </form>
</body>
</html>
