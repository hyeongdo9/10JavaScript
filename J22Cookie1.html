<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
  /*
  쿠키(Cookie) : 웹사이트가 사용자의 브라우저에 저장하는 작은 데이터
  파일. 주로 로그인, 사용자 설정 저장 등의 기능에 사용된다. 

  쿠키 생성 : 매개변수로 전달되는 exp가 양수면 미래의 시간으로 설정되므로 
  쿠키가 생성된다. 반대로 음수라면 과거의 시간으로 설정되므로 쿠키는
  삭제된다. 쿠키는 웹 브라우적를 닫아도 즉시 삭제되지 않고 유효기간 동안 
  유지된다. 
  */
  //3개의 매개변수는 순서대로 쿠키명, 쿠키값, 유효시간(날짜단위)
  var setCookie = function(name, value, exp) {
      //유효시간 설정을 위해 Date 객체 생성 
      var date = new Date();
      //타임스탬프에 매개변수로 전달된 exp(날짜단위)와 연산하여 유효기간 설정
      date.setTime(date.getTime() + exp * 24 * 60 * 60 * 1000);
      //쿠키 생성 : 쿠키명=쿠키값;유효시간=xx;적용할경로=yy;
      document.cookie = name + '=' + value + ';expires=' + date.toUTCString() + ';path=/';
  };
  /*
  쿠키 읽기 : 쿠키는 ;(세미콜론)으로 구분되므로 1차 split 한 후 =(이퀄)
  로 2차 split 하여 쿠키값을 읽을 수 있다.
  */
  var getCookie = function(name) {
      //1차 split으로 배열 생성 
      var value = document.cookie.split(";");
      //항목의 갯수만큼 반복
      for(var i = 0; i < value.length; i++) {
          //2차 split으로 쿠키명과 값을 분리 
          var unit = values[i].trim();
          var value = unit.split('=');
          //매개변수로 전달된 쿠키명과 비교
          if(value[0] == name) {
              //해당 쿠키값을 반환한다.
              return unescape(value[1]);
          }
      }
      //찾는 이름이 없다면 null을 반환한다.
      return null;
  };

  //쿠키를 만들기 위한 함수
  function makeCookie() {
      //사용자가 입력한 값을 읽어온다.
      var cName = document.getElementById('cName').value;
      var cValue = document.getElementById('cValue').value;
      //쿠키명, 쿠키값, 유효기간은 1일로 설정하여 쿠키 생성 
      setCookie(cName, cValue, 1);
      alert('쿠기가 생성되었습니다.');
      //F5을 눌러 새로고침 하듯 화면을 리플레쉬 한다. 
      location.reload();
  }
  //쿠키값을 읽기 위한 함수
  function readCookie() {
      //입력상자로부터 읽을 쿠키명을 가져온다.
      var cName = document.getElementById('cName').value;
      //해당 이름으로 생성된 쿠키를 읽어온다.
      var readValue = getCookie(cName);
      if(readValue == Null){
          alert("쿠키값:"+readValue);
      }
  }

  //쿠키 삭제하기 : 과거의 시간으로 설정하면 삭제된다.
  function deleteCookie() {
      var cName = document.getElementById('cName').value;
      //유효기간을 -1, 즉 어제의 날짜로 설정한다.
      setCookie(cName, cValue, -1);
      alert('쿠키가 삭제되었습니다.');
      location.reload();
  }
  </script>
</head>
<body>
    <h2>쿠키 생성 하기</h2>
    <form action="">
        쿠키명:<input type="text" id="cName" value="popup1">
        <br>
        쿠키에 저장할 값 : <input type="text" id="cValue" value="팝업창 열기">
        <br>
        <button type="button" onclick="makeCookie()">쿠키 생성</button>
        <button type="button" onclick="readCookie()">쿠키 읽기</button>
        <button type="button" onclick="deleteCookie()">쿠키 삭제</button>
    </form>
</body>
</html>
