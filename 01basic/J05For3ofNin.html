<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>for .. of 와 in 구문</h2>
    <script>
    //배열 선언 및 초기화. JS에서는 다양한 자료형으로 초기화 가능.
    const myArray = [10, '이십', 30];

    console.error("배열의 length로 반복")
    //배열의 크기를 통한 반복. 이때는 인덱스를 통해 요소에 접근. 
    for (let i = 0; i < myArray.length; i++) {
        console.log(myArray[i]);
    }

    //Java의 확장for문과 비슷하게 배열에 저장된 값을 순서대로 인출한다. 즉 인덱스 없이 사용할 수 있다. 
    console.error("for~of로 반복")
    for (const v of myArray) {
        console.log(v);
    }  

    //배열의 인덱스를 순서대로 인출 
    console.error("for~in으로 반복")
    for (const i in myArray) {
        //따라서 요소에 접근하려면 인덱스를 사용해야 한다. 
        console.log(i, myArray[i]);
    }  
    </script>
</body>
</html>
