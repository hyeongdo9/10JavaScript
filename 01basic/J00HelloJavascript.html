<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<h2>처음 만들어보는 Javascript</h2>
	<script>
		//변수 선언시 var 사용
		var number;
		//변수 선언시 초기값을 할당하지 않으면 undefined가 된다. 
		console.log("number="+ number);

		//따라서 undefined를 통해 조건문을 만들 수 있다. 
		if(number==undefined){
			console.log("타입이 정의되지 않았습니다.");
		}
		else{
			console.log("타입이 정의되었습니다.");
		}

		//변수에 숫자를 할당하면 number 타입의 변수가 된다. 
		number = 10;
		console.log('number', number);
		if(number==undefined){
			console.log("타입이 정의되지 않음 ㅜㅜ");
		}
		else{
			//typeof()를 통해 자료형을 확인하면 number 타입 출력 
			console.log("타입이 정의됨^^", typeof(number));
		}
	</script>
</body>
</html>
