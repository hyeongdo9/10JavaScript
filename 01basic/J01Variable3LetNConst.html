<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>let 과 const</h2>
    <script>
    /*
    변수 및 상수 선언 
    const : 상수 선언시 사용. 초기화 이후에는 값을 변경할 수 없다.
    let : 변수 선언시 사용. 기본적인 문법은 var와 동일하지만, 
      호이스팅 문제나 스코프(지역) 관련된 문제점을 해결하였다. 
    */     
    //상수 선언 및 초기화 
    const num = 100;
    //값을 재할당할 수 없으므로 에러 발생 
    //num = 200; 
    console.log("상수", num);

    /*  
    변수 x를 var로 선언하면 최상단으로 끌어올려지는 '호이스팅'이 
    발생하게 되므로 선언 이전에 출력하는게 가능하다. 하지만 이 현상은
    문법적으로는 맞지않기 때문에 ES6에서는 이를 보완한 let이 등장하게
    되었다. */
    //let은 호이스팅 되지 않으므로 에러발생. 선언전에는 사용 불가.
    //console.log('변수 x 선언전='+ x); 
    let x = 10;
    console.log('변수 x 선언후='+ x);
    //이미 선언되었으므로 재선언할 수 없다. 
    //let x = 20;

    /*
    let은 호이스팅 되지 않으므로 정의하기전에 미리 할당하는것은 
    불가능하다. */
    //console.log('변수 y 정의전='+ y);
    y = 100;
    //console.log('변수 y 정의후='+ y);
    //var y = 200; 
    let y = 200; 
    console.log('변수 y 선언후='+ y);
    </script>
</body>
</html>
